services:
  - type: web
    name: momo-xmd
    env: node
    buildCommand: npm install
    startCommand: node main.js
    envVars:
      - key: SESSION_ID
        sync: false
      - key: OWNER_NUMBER
        value: "255760298574"
      - key: MODE
        value: "private"
      - key: PREFIX
        value: "."
