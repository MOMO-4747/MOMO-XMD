<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO-XMD PAIRING</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0e1111;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #333;
        }
        h1 {
            color: #00d2ff;
            margin-bottom: 20px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .tab-container {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            border-bottom: 2px solid #00d2ff;
            color: #00d2ff;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #252525;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,210,255,0.3);
        }
        button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }
        #result-container {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #252525;
            display: none;
        }
        #pairing-code {
            font-size: 28px;
            font-weight: bold;
            color: #00d2ff;
            letter-spacing: 5px;
            margin: 10px 0;
        }
        #qr-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #00d2ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MOMO-XMD</h1>
        
        <div class="tab-container">
            <div class="tab active" id="tab-pairing" onclick="switchTab('pairing')">Pairing Code</div>
            <div class="tab" id="tab-qr" onclick="switchTab('qr')">QR Code</div>
        </div>

        <div id="pairing-form">
            <div class="form-group">
                <label for="number">Phone Number (with country code)</label>
                <input type="text" id="number" placeholder="e.g. 255760298574">
            </div>
            <button id="btn-pair" onclick="generatePairingCode()">Generate Code</button>
        </div>

        <div id="qr-form" style="display: none;">
            <p style="color: #aaa; font-size: 14px;">Click the button below to generate a QR Code for scanning.</p>
            <button id="btn-qr" onclick="generateQRCode()">Generate QR Code</button>
        </div>

        <div class="loader" id="loader"></div>

        <div id="result-container">
            <div id="pairing-result" style="display: none;">
                <p style="font-size: 14px; color: #aaa;">Your Pairing Code:</p>
                <div id="pairing-code"></div>
                <p style="font-size: 12px; color: #00d2ff;">Enter this code on your WhatsApp (Link Device > Link with phone number)</p>
            </div>
            <div id="qr-result" style="display: none;">
                <p style="font-size: 14px; color: #aaa;">Scan this QR Code:</p>
                <img id="qr-image" src="" alt="QR Code">
            </div>
        </div>

        <div class="footer">
            Built by MOMO47 &copy; 2026
        </div>
    </div>

    <script>
        let currentMode = 'pairing';

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-pairing').classList.toggle('active', mode === 'pairing');
            document.getElementById('tab-qr').classList.toggle('active', mode === 'qr');
            document.getElementById('pairing-form').style.display = mode === 'pairing' ? 'block' : 'none';
            document.getElementById('qr-form').style.display = mode === 'qr' ? 'block' : 'none';
            document.getElementById('result-container').style.display = 'none';
        }

        async function generatePairingCode() {
            const number = document.getElementById('number').value;
            if (!number) return alert('Please enter a phone number');

            showLoading(true);
            try {
                const response = await fetch('/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number })
                });
                const data = await response.json();
                if (data.code) {
                    document.getElementById('pairing-code').innerText = data.code;
                    document.getElementById('pairing-result').style.display = 'block';
                    document.getElementById('qr-result').style.display = 'none';
                    document.getElementById('result-container').style.display = 'block';
                } else {
                    alert(data.error || 'Failed to generate code. Please try again.');
                }
            } catch (err) {
                alert('Connection error. Please check your internet.');
            } finally {
                showLoading(false);
            }
        }

        async function generateQRCode() {
            showLoading(true);
            try {
                const response = await fetch('/qr');
                const data = await response.json();
                if (data.qr) {
                    document.getElementById('qr-image').src = data.qr;
                    document.getElementById('qr-result').style.display = 'block';
                    document.getElementById('pairing-result').style.display = 'none';
                    document.getElementById('result-container').style.display = 'block';
                } else {
                    alert(data.error || 'Failed to generate QR Code.');
                }
            } catch (err) {
                alert('Connection error.');
            } finally {
                showLoading(false);
            }
        }

        function showLoading(show) {
            document.getElementById('loader').style.display = show ? 'block' : 'none';
            document.getElementById('btn-pair').disabled = show;
            document.getElementById('btn-qr').disabled = show;
            if (show) document.getElementById('result-container').style.display = 'none';
        }
    </script>
</body>
</html>
