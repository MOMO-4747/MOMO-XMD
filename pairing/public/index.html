<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO-XMD Cyber Pairing</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Rajdhani', sans-serif;
            padding: 20px;
            color: #00f2fe;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(10, 14, 26, 0.9);
            border: 1px solid #00f2fe30;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 50px #00f2fe20, inset 0 0 20px #00f2fe10;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            width: 180px; height: 180px; border-radius: 50%;
            margin: 0 auto 20px;
            position: relative;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(45deg, #00f2fe, #00ff64);
            padding: 5px;
            box-shadow: 0 0 40px #00f2fe, 0 0 80px #00ff64;
        }
        .logo img {
            width: 100%; height: 100%; border-radius: 50%;
            object-fit: cover;
            background: #0a0e1a;
            padding: 5px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2em;
            color: #00f2fe;
            text-shadow: 0 0 15px #00f2fe, 0 0 30px #00ff64;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.1em;
            color: #00ff64;
            margin-bottom: 25px;
        }
        .tab-buttons {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #00f2fe30;
        }
        .tab-button {
            flex: 1;
            padding: 15px 0;
            background: transparent;
            border: none;
            color: #00f2fe80;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        .tab-button.active {
            color: #00f2fe;
            border-bottom: 3px solid #00f2fe;
            text-shadow: 0 0 10px #00f2fe;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: calc(100% - 22px);
            padding: 12px;
            border: 1px solid #00f2fe50;
            background: #0a0e1a;
            color: #00ff64;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s ease;
        }
        input[type="text"]::placeholder {
            color: #00f2fe50;
        }
        input[type="text"]:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 10px #00f2fe50;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00f2fe, #00ff64);
            border: none;
            border-radius: 8px;
            color: #0a0e1a;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            box-shadow: 0 0 20px #00f2fe50;
        }
        button:hover {
            background: linear-gradient(90deg, #00ff64, #00f2fe);
            box-shadow: 0 0 30px #00ff64;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
        .qr-container {
            text-align: center;
            margin-top: 20px;
        }
        #qr-image {
            width: 250px; height: 250px;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 30px #00f2fe50;
            display: none;
            margin: 0 auto 20px;
        }
        #qr-status {
            color: #00f2fe;
            font-size: 1.1em;
            margin-top: 15px;
        }
        #pair-code-display {
            background: #1a1a2e;
            border: 1px dashed #00f2fe;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Orbitron', monospace;
            font-size: 1.3em;
            color: #00ff64;
            word-break: break-all;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 0 20px #00f2fe30;
        }
        .status-message {
            margin-top: 20px;
            font-size: 1.1em;
            color: #00f2fe;
            text-align: center;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
            color: #00f2fe80;
        }
        .footer a {
            color: #00ff64;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo">
                <img src="https://raw.githubusercontent.com/MOMO-4747/MOMO-XMD/main/media/momo_hacker_logo.png" alt="MOMO-XMD Logo">
            </div>
            <h1>MOMO-XMD CYBER PAIRING</h1>
            <p>Securely link your WhatsApp bot.</p>
        </div>

        <div class="tab-buttons">
            <button class="tab-button active" onclick="openTab(event, 'pairing-code')">PAIRING CODE</button>
            <button class="tab-button" onclick="openTab(event, 'qr-code')">QR CODE</button>
        </div>

        <div id="pairing-code" class="tab-content active">
            <div class="input-group">
                <input type="text" id="phone-number" placeholder="Enter WhatsApp number (e.g., 255760298574)">
            </div>
            <button onclick="generatePairingCode()" id="pair-btn">GENERATE PAIRING CODE</button>
            <div id="pair-code-display" style="display: none;"></div>
            <div id="pairing-status" class="status-message"></div>
        </div>

        <div id="qr-code" class="tab-content">
            <div class="qr-container">
                <img id="qr-image" src="" alt="QR Code">
                <p id="qr-status">Click 'Generate QR' to start.</p>
                <button onclick="generateQRCode()" id="qr-btn">GENERATE QR CODE</button>
            </div>
        </div>

        <div class="footer">
            Built with ❤️ by <a href="https://github.com/MOMO-4747">MOMO47</a>
        </div>
    </div>

    <script>
        let currentCode = '';

        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        async function generatePairingCode() {
            const phoneNumber = document.getElementById('phone-number').value;
            const pairBtn = document.getElementById('pair-btn');
            const pairCodeDisplay = document.getElementById('pair-code-display');
            const pairingStatus = document.getElementById('pairing-status');

            if (!phoneNumber) {
                alert('Please enter your WhatsApp number.');
                return;
            }

            pairBtn.disabled = true;
            pairBtn.innerHTML = 'GENERATING...';
            pairingStatus.textContent = 'Requesting pairing code...';
            pairingStatus.style.color = '#00f2fe';

            try {
                const response = await fetch('/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: phoneNumber })
                });
                const data = await response.json();

                if (data.success) {
                    currentCode = data.code;
                    pairCodeDisplay.textContent = 'CODE: ' + data.code;
                    pairCodeDisplay.style.display = 'block';
                    pairingStatus.textContent = 'Enter this code in WhatsApp > Linked Devices.';
                    pairingStatus.style.color = '#00ff64';
                } else {
                    pairingStatus.textContent = 'Error: ' + (data.message || 'Failed to generate code.');
                    pairingStatus.style.color = '#ff4757';
                    pairCodeDisplay.style.display = 'none';
                }
            } catch (error) {
                pairingStatus.textContent = 'Server error. Please try again later.';
                pairingStatus.style.color = '#ff4757';
                pairCodeDisplay.style.display = 'none';
            }
            pairBtn.disabled = false;
            pairBtn.innerHTML = 'GENERATE PAIRING CODE';
        }

        async function generateQRCode() {
            const qrImage = document.getElementById('qr-image');
            const qrStatus = document.getElementById('qr-status');
            const qrBtn = document.getElementById('qr-btn');

            qrBtn.disabled = true;
            qrBtn.innerHTML = 'GENERATING QR...';
            qrStatus.textContent = 'Generating QR Code...';
            qrStatus.style.color = '#00f2fe';
            qrImage.style.display = 'none';

            try {
                const response = await fetch('/qr');
                const data = await response.json();

                if (data.success && data.qr) {
                    qrImage.src = data.qr;
                    qrImage.style.display = 'block';
                    qrStatus.textContent = 'Scan this QR with WhatsApp > Linked Devices.';
                    qrStatus.style.color = '#00ff64';
                } else {
                    qrStatus.textContent = 'Error: ' + (data.message || 'Failed to generate QR.');
                    qrStatus.style.color = '#ff4757';
                    qrImage.style.display = 'none';
                }
            } catch (error) {
                qrStatus.textContent = 'Server error. Please try again later.';
                qrStatus.style.color = '#ff4757';
                qrImage.style.display = 'none';
            }
            qrBtn.disabled = false;
            qrBtn.innerHTML = 'GENERATE QR CODE';
        }

        // Default to pairing code tab on load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('pairing-code').style.display = 'block';
            document.querySelector('.tab-button').classList.add('active');
        });
    </script>
</body>
</html>
